{{- $p := (index .Values.policies "disallow-automount-service-account-token") | default dict }}
{{- if $p.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-automount-service-account-token
  annotations:
    policies.kyverno.io/title: Disallow Automount Service Account Token
    policies.kyverno.io/category: Pod Security - Access
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Por padrão, todo Pod monta automaticamente o token do seu ServiceAccount,
      mesmo quando nunca vai chamar a API do Kubernetes. Se o container for
      comprometido, esse token vira uma credencial de acesso à API pronta para
      uso pelo atacante. Esta política exige que o Pod declare
      'automountServiceAccountToken' explicitamente (true ou false) em vez de
      depender do default implícito do cluster: workloads sem necessidade de
      falar com a API devem declarar 'false'; quem realmente precisa deve
      declarar 'true' de propósito, sabendo que está expondo essa credencial.
spec:
  validationFailureAction: {{ $p.validationFailureAction | default $.Values.validationFailureAction }}
  background: true
  rules:
    - name: check-automount-token
      {{- include "kyverno-guardrails-policies.matchExclude" (dict "p" $p "root" $ "kinds" (list "Pod")) | nindent 6 }}
      validate:
        message: >-
          Defina 'spec.automountServiceAccountToken' explicitamente como 'true'
          ou 'false' — não deixe o valor implícito do cluster decidir por você.
          Se este Pod não chama a API do cluster, use 'false'.
        pattern:
          spec:
            automountServiceAccountToken: "false | true"
{{- end }}
