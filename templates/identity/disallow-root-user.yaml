{{- $p := (index .Values.policies "disallow-root-user") | default dict }}
{{- if $p.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security - Identity
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Executar containers como root (UID 0) é um risco de segurança grave.
      Em caso de escape do container, o atacante teria privilégios de root no host.
      Esta política bloqueia Pods que definam runAsUser=0 explicitamente, seja
      no securityContext do Pod ou no de qualquer container.
spec:
  validationFailureAction: {{ $p.validationFailureAction | default $.Values.validationFailureAction }}
  background: true
  rules:
    - name: check-runasuser-containers
      {{- include "kyverno-guardrails-policies.matchExclude" (dict "p" $p "root" $ "kinds" (list "Pod")) | nindent 6 }}
      validate:
        message: "Executar como root (UID 0) não é permitido. Defina 'runAsUser' com valor maior que 0."
        pattern:
          spec:
            =(securityContext):
              =(runAsUser): ">0"
            =(initContainers):
              - =(securityContext):
                  =(runAsUser): ">0"
            containers:
              - =(securityContext):
                  =(runAsUser): ">0"
            =(ephemeralContainers):
              - =(securityContext):
                  =(runAsUser): ">0"
{{- end }}
