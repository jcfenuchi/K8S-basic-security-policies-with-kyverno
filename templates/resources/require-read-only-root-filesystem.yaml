{{- $p := (index .Values.policies "require-read-only-root-filesystem") | default dict }}
{{- if $p.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-read-only-root-filesystem
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security - Resources
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Um filesystem root gravável permite que um processo comprometido dentro
      do container persista malware ou modifique binários do sistema operacional.
      Definir readOnlyRootFilesystem=true força o container a escrever apenas
      em volumes explicitamente declarados (emptyDir, PVC), o que reduz
      significativamente o impacto de um container comprometido.
spec:
  validationFailureAction: {{ $p.validationFailureAction | default $.Values.validationFailureAction }}
  background: true
  rules:
    - name: check-readonly-filesystem
      {{- include "kyverno-guardrails-policies.matchExclude" (dict "p" $p "root" $ "kinds" (list "Pod")) | nindent 6 }}
      validate:
        message: "Todos os containers devem ter 'securityContext.readOnlyRootFilesystem: true'."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
            =(initContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
{{- end }}
