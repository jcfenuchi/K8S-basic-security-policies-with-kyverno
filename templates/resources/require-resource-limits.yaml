{{- $p := (index .Values.policies "require-resource-limits") | default dict }}
{{- if $p.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Pod Security - Resources
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers sem limits de recursos podem consumir toda a CPU e memória
      disponível no nó, causando instabilidade e afetando outros workloads.
      Esta política exige que todos os containers declarem limits de CPU e memória.
spec:
  validationFailureAction: {{ $p.validationFailureAction | default $.Values.validationFailureAction }}
  background: true
  rules:
    - name: check-resource-limits
      {{- include "kyverno-guardrails-policies.matchExclude" (dict "p" $p "root" $ "kinds" (list "Pod")) | nindent 6 }}
      validate:
        message: "Todos os containers devem declarar 'resources.limits' para CPU e memória."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(initContainers):
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
{{- end }}
